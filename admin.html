<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Administración · El Tribunal de la Tinta</title><link rel="stylesheet" href="style.css"><style>[hidden]{display:none!important}#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:12px 18px;color:#fff;z-index:9;max-width:90%}#toast.ok{background:#2f5d34}#toast.bad{background:#a02020}.bd{display:inline-block;padding:2px 8px;font-size:13px;color:#fff}.bd.pendiente{background:#9a6b1a}.bd.aprobada{background:#2f5d34}.bd.rechazada{background:#a02020}.fl{display:flex;gap:8px;margin:12px 0;align-items:center}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.dy{background:#fffaf0;color:#3b2a20;border:1px solid #e4d8c4;padding:10px 0}.dy.on{background:#8b1a2e;color:#f8f1e7}.dy i{display:block;font-size:11px;font-style:normal;color:#8b1a2e}.dy.on i{color:#f8f1e7}.gn{display:flex;flex-wrap:wrap;gap:2px 16px;border:1px solid #bfae95;padding:8px 12px;margin:12px 0}.gn label{margin:4px 0;font-size:14px}.gn input{width:auto}</style></head><body>
<header><span class="logo">Administración</span><nav id="tabs" hidden><a href="#" data-v="posts">Publicaciones</a><a href="#" data-v="cal">Calendario</a><a href="#" data-v="pend">Pendientes</a><a href="#" data-v="about">Sobre mí</a><a href="index.html">Ver blog</a><a href="#" id="out">Salir</a></nav></header>
<main class="in" id="main"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(TT.SUPABASE_URL,TT.SUPABASE_ANON_KEY),main=document.getElementById('main'),tabs=document.getElementById('tabs');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=(n,l,v='',t='text')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}"></label>`;
const T=(n,l,v='',r=5)=>`<label>${l}<textarea name="${n}" rows="${r}">${esc(v)}</textarea></label>`;
let pf='pendiente',cd=null,cm=new Date(new Date().getFullYear(),new Date().getMonth(),1);
function toast(m,bad){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.className=bad?'bad':'ok';t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,4500)}
function login(msg=''){tabs.hidden=true;main.innerHTML=`<form id="lf"><h2>Entrar</h2>${F('email','Correo','','email')}${F('password','Contraseña','','password')}<p class="err">${msg}</p><button>Entrar</button> <a href="index.html">Volver al blog</a><p><small>Versión segura 2</small></p></form>`;
document.getElementById('lf').onsubmit=async e=>{e.preventDefault();const f=e.target,{error}=await sb.auth.signInWithPassword({email:f.email.value,password:f.password.value});if(error)return login('Correo o contraseña incorrectos.');const {data}=await sb.rpc('is_admin');if(!data){await sb.auth.signOut();return login('Esta cuenta no es de administración.')}go('posts')}}
async function go(v){const {data}=await sb.auth.getSession();if(!data.session)return login();tabs.hidden=false;views[v]()}
const CATS=['Análisis literario','Opinión','Debate','Controversia','Reflexiones','Distopía','Clásicos','Autores','Recomendaciones','Lecturas del mes','Poesía','Ensayo','Adaptaciones','Wattpad y lectura juvenil','Noticias literarias','Reseña'];
const GENS=['Novela','Cuento','Poesía','Teatro','Ensayo','Biografía y memorias','Ciencia ficción','Fantasía','Distopía','Terror','Misterio','Policíaca y negra','Thriller','Romance','Novela histórica','Aventura','Juvenil','Infantil','Clásicos','Realismo mágico','Drama','Humor','Filosofía','Historia','Psicología','Ciencia','Autoayuda','Cómic y novela gráfica','Manga','Ficción contemporánea','No ficción'];
function form(p={}){const sel=(p.genre||'').split(', ').filter(Boolean),cs=CATS.includes(p.category)||!p.category?CATS:[...CATS,p.category],gs=[...GENS,...sel.filter(x=>!GENS.includes(x))];main.innerHTML=`<form id="pf"><h2>${p.id?'Editar':'Nueva'} publicación</h2>
<label>Tipo<select name="kind"><option value="articulo">Artículo</option><option value="resena">Reseña</option></select></label>
${F('title','Título',p.title)}${F('excerpt','Resumen corto',p.excerpt)}${F('cover_url','Imagen de portada (nombre del archivo o URL)',p.cover_url,'text')}<label>Categoría<select name="category"><option value="">Sin categoría</option>${cs.map(c=>`<option ${c==p.category?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
${F('book_author','Autor del libro (reseñas)',p.book_author)}<fieldset class="gn"><legend>Géneros (hasta 3)</legend>${gs.map(g=>`<label><input type="checkbox" name="g" value="${esc(g)}" ${sel.includes(g)?'checked':''}> ${esc(g)}</label>`).join('')}</fieldset>
<label>Puntuación (reseñas)<select name="rating"><option value="">Sin puntuación</option>${[0.5,1,1.5,2,2.5,3,3.5,4,4.5,5].map(n=>`<option>${n}</option>`).join('')}</select></label>
${F('publish_date','Fecha de publicación',p.publish_date||new Date().toISOString().slice(0,10),'date')}
${T('content','Contenido (una línea en blanco separa párrafos)',p.content,14)}
<label class="chk"><input type="checkbox" name="featured" ${p.featured?'checked':''}> Destacar en la portada</label>
<button value="publicado">Publicar</button> <button value="borrador" class="sec">Guardar borrador</button> <button type="button" class="sec" data-a="cx">Cancelar</button></form>`;
const f=document.getElementById('pf');f.kind.value=p.kind||'articulo';f.onchange=e=>{if(e.target.name=='g'&&f.querySelectorAll('[name=g]:checked').length>3){e.target.checked=false;alert('Puedes elegir hasta 3 géneros.')}};f.rating.value=p.rating||'';
f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f)),feat=f.featured.checked;
const row={kind:d.kind,title:d.title,excerpt:d.excerpt,cover_url:d.cover_url,category:d.category,book_author:d.book_author,genre:[...f.querySelectorAll('[name=g]:checked')].map(x=>x.value).join(', '),rating:d.rating?+d.rating:null,publish_date:d.publish_date,content:d.content,status:e.submitter.value,featured:feat};
if(feat)await sb.from('posts').update({featured:false}).neq('id',p.id||'00000000-0000-0000-0000-000000000000');
const {error}=await(p.id?sb.from('posts').update(row).eq('id',p.id):sb.from('posts').insert(row));
if(error)return alert('No se pudo guardar: '+error.message);go('posts')}}
const views={
async posts(){const {data,error}=await sb.from('posts').select('id,title,kind,status,publish_date,featured').order('publish_date',{ascending:false});
if(error)return main.innerHTML='<p class="err">'+esc(error.message)+'</p>';
main.innerHTML=`<h2>Publicaciones</h2><button data-a="new">Nueva publicación</button><ul class="rows">${data.map(p=>`<li><b>${esc(p.title)}</b>${p.featured?' (destacada)':''}<br><small>${p.kind=='resena'?'Reseña':'Artículo'} · ${p.status} · ${p.publish_date}</small><span><button class="sec" data-a="edit" data-id="${p.id}">Editar</button><button class="sec" data-a="delp" data-id="${p.id}">Eliminar</button></span></li>`).join('')||'<li>Aún no hay publicaciones.</li>'}</ul>`},
async pend(){const q=t=>sb.from(t).select(t=='comments'?'*,posts(title)':'*').eq('status',pf).order('created_at',{ascending:false}).limit(100);
const [s,c]=await Promise.all([q('submissions'),q('comments')]);if(s.error||c.error)return toast('No se pudo cargar: '+(s.error||c.error).message,true);
const bd=x=>`<span class="bd ${x}">${{pendiente:'Pendiente',aprobada:'Aprobado',rechazada:'Rechazado'}[x]}</span>`,fh=x=>new Date(x.created_at).toLocaleString('es');
const btn=(t,x)=>(x.status!='aprobada'?`<button data-a="st" data-t="${t}" data-s="aprobada" data-id="${x.id}">Aprobar</button>`:'')+(x.status!='rechazada'?`<button class="sec" data-a="st" data-t="${t}" data-s="rechazada" data-id="${x.id}">Rechazar</button>`:'')+`<button class="sec" data-a="deli" data-t="${t}" data-id="${x.id}">Eliminar</button>`;
main.innerHTML=`<h2>Moderación</h2><div class="fl">${['pendiente','aprobada','rechazada'].map(x=>`<button class="${x==pf?'':'sec'}" data-a="pf" data-s="${x}">${{pendiente:'Pendientes',aprobada:'Aprobadas',rechazada:'Rechazadas'}[x]}</button>`).join('')}</div>
<h3>Reseñas de lectores</h3><ul class="rows">${(s.data||[]).map(x=>`<li><b>${esc(x.book_title)}</b> ${esc(x.book_author||'')} ${'★'.repeat(x.rating)} ${bd(x.status)}<br><small>${esc(x.reader_name)} · ${fh(x)}</small><p>${esc(x.opinion)}</p><span>${btn('submissions',x)}</span></li>`).join('')||'<li class="mut">Nada en esta lista.</li>'}</ul>
<h3>Comentarios</h3><ul class="rows">${(c.data||[]).map(x=>`<li><b>${esc(x.name)}</b> en «${esc(x.posts?.title||'')}» ${bd(x.status)}<br><small>${fh(x)}</small><p>${esc(x.body)}</p><span>${btn('comments',x)}</span></li>`).join('')||'<li class="mut">Nada en esta lista.</li>'}</ul>`},
async about(){const {data}=await sb.from('site').select('value').eq('key','about').maybeSingle(),v=data?.value||{};
main.innerHTML=`<form id="af"><h2>Sobre mí</h2>${T('bio','Biografía',v.bio)}${T('journey','Experiencia y trayectoria como lectora',v.journey)}${T('why','Por qué creé el blog',v.why)}${T('offers','Qué ofrece a los lectores',v.offers)}${F('quote','Cita destacada',v.quote)}${F('quote_by','Autor y obra de la cita',v.quote_by)}${F('photo_url','Foto (nombre del archivo o URL)',v.photo_url,'text')}${F('hero_url','Foto de la portada del inicio (URL)',v.hero_url,'text')}${F('logo_url','Logo (URL)',v.logo_url,'text')}${F('instagram','Enlace de Instagram',v.instagram,'url')}${F('tiktok','Enlace de TikTok',v.tiktok,'url')}${F('goodreads','Enlace de Goodreads',v.goodreads,'url')}<button>Guardar</button></form>`;
document.getElementById('af').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('site').upsert({key:'about',value:Object.fromEntries(new FormData(e.target))});alert(error?error.message:'Guardado')}}};
views.cal=async()=>{const y=cm.getFullYear(),m=cm.getMonth(),t=new Date().toISOString().slice(0,10),{data,error}=await sb.from('posts').select('id,title,kind,status,publish_date').order('publish_date');if(error)return toast(error.message,true);
const first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),by={};data.forEach(p=>(by[p.publish_date]??=[]).push(p));
let cells='';for(let i=0;i<first;i++)cells+='<div></div>';
for(let n=1;n<=days;n++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,l=by[k]||[];cells+=`<button class="dy${k==cd?' on':''}" data-a="day" data-s="${k}">${n}${l.length?`<i>${l.length}</i>`:''}</button>`}
const sel=cd?by[cd]||[]:[];
main.innerHTML=`<h2>Calendario</h2><div class="fl"><button class="sec" data-a="mm" data-s="-1">‹</button><b style="flex:1;text-align:center">${cm.toLocaleDateString('es',{month:'long',year:'numeric'})}</b><button class="sec" data-a="mm" data-s="1">›</button></div><div class="cg">${['L','M','X','J','V','S','D'].map(x=>`<small>${x}</small>`).join('')}${cells}</div>`
+(cd?`<h3>${cd}</h3><ul class="rows">${sel.map(p=>`<li><b>${esc(p.title)}</b><br><small>${p.kind=='resena'?'Reseña':'Artículo'} · ${p.status=='publicado'?(p.publish_date>t?'Programada':'Publicada'):'Borrador'}</small><span><button class="sec" data-a="edit" data-id="${p.id}">Editar</button></span></li>`).join('')||'<li class="mut">Nada programado este día.</li>'}</ul>
<form id="nf"><h3>Programar en esta fecha</h3><label>Tipo<select name="kind"><option value="articulo">Artículo</option><option value="resena">Reseña</option></select></label>${F('title','Título')}<label>Fecha<input type="date" name="d" value="${cd}"></label><label>Estado<select name="st"><option value="borrador">Guardar como borrador</option><option value="publicado">Programar para publicar</option></select></label><button>Guardar</button></form>`:'<p class="mut">Toca un día para ver o programar publicaciones. Las programadas aparecen solas en el blog al llegar su fecha.</p>');
const nf=document.getElementById('nf');if(nf)nf.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(nf));if(!f.title.trim())return toast('Escribe un título.',true);const {data:r,error:er}=await sb.from('posts').insert({kind:f.kind,title:f.title.trim(),publish_date:f.d,status:f.st,category:f.kind=='resena'?'Reseña':null}).select('id');if(er||!r?.length)return toast('No se pudo guardar: '+(er?.message||'sin permiso'),true);toast('Guardado.');cd=f.d;views.cal()}};
main.onclick=async e=>{if(tabs.hidden)return;const b=e.target.closest('[data-a]');if(!b)return;const {a,id,t,s}=b.dataset;
if(a=='new')return form();if(a=='cx')return go('posts');
if(a=='edit'){const {data}=await sb.from('posts').select('*').eq('id',id).single();return form(data)}
if(a=='delp'&&confirm('¿Eliminar esta publicación?')){await sb.from('posts').delete().eq('id',id);return go('posts')}
if(a=='pf'){pf=s;return views.pend()}if(a=='day'){cd=s;return views.cal()}if(a=='mm'){cm=new Date(cm.getFullYear(),cm.getMonth()+ +s,1);cd=null;return views.cal()}
if(a=='st'){const {data,error}=await sb.from(t).update({status:s}).eq('id',id).select('id');if(error||!data?.length)return toast('No se pudo guardar el cambio: '+(error?error.message:'sin permiso o elemento no encontrado'),true);toast(s=='aprobada'?'Aprobado. Ya aparece en el blog.':'Rechazado. Ya no se muestra en el blog.');return views.pend()}
if(a=='deli'&&confirm('¿Eliminar definitivamente?')){const {data,error}=await sb.from(t).delete().eq('id',id).select('id');if(error||!data?.length)return toast('No se pudo eliminar: '+(error?error.message:'sin permiso'),true);toast('Eliminado.');return views.pend()}};
tabs.onclick=e=>{if(tabs.hidden)return;e.preventDefault();const a=e.target.closest('a');if(!a)return;if(a.dataset.v===undefined&&a.id!='out'){location.href=a.href;return}a.id=='out'?sb.auth.signOut().then(()=>login()):go(a.dataset.v)};
sb.auth.getSession().then(async({data})=>{data.session&&(await sb.rpc('is_admin')).data?go('posts'):login()});
</script></body></html>
