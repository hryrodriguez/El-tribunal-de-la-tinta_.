<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Tribunal de la Tinta</title>
<meta name="description" content="Literatura, análisis, reseñas y debate. Cada libro tiene una historia. Cada historia merece ser cuestionada.">
<link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Lora&display=swap" rel="stylesheet"></head><body>
<header><a class="logo" href="#/">El Tribunal de la <em>Tinta</em></a><nav id="nav"></nav></header>
<main id="app"></main>
<footer>© El Tribunal de la Tinta · Literatura, pensamiento y comunidad</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(TT.SUPABASE_URL,TT.SUPABASE_ANON_KEY),app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'});
const stars=n=>n?'★'.repeat(n)+'☆'.repeat(5-n):'';
const paras=t=>esc(t).split(/\n\s*\n/).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
const today=()=>new Date().toISOString().slice(0,10);
const NAV=[['','Inicio'],['articulos','Artículos'],['resenas','Reseñas'],['comunidad','Comunidad'],['sobre-mi','Sobre mí'],['calendario','Calendario']];
document.getElementById('nav').innerHTML=NAV.map(n=>`<a href="#/${n[0]}" data-r="${n[0]}">${n[1]}</a>`).join('');
let posts=null;
async function load(){if(posts)return posts;const {data,error}=await sb.from('posts').select('*').eq('status','publicado').order('publish_date',{ascending:false});if(error)throw error;return posts=data}
const live=()=>posts.filter(p=>p.publish_date<=today());
const card=p=>`<a class="card" href="#/post/${p.id}">${p.cover_url?`<img src="${esc(p.cover_url)}" alt="">`:''}<small>${esc(p.category||p.genre||'')} · ${fmt(p.publish_date)}</small><h3>${esc(p.title)}</h3>${p.kind=='resena'?`<div class="st">${esc(p.book_author||'')} ${stars(p.rating)}</div>`:''}<p>${esc(p.excerpt||'')}</p></a>`;
const grid=a=>a.length?`<div class="grid">${a.map(card).join('')}</div>`:'<p class="mut">Aún no hay publicaciones aquí.</p>';
const V={
async ''(){const l=live(),f=l.find(p=>p.featured)||l[0];
return `<section class="hero"><p class="mut">Literatura, análisis y debate</p><h1>El Tribunal de la <em>Tinta</em></h1><p>Cada libro tiene una historia.<br>Cada historia merece ser cuestionada.</p></section>`
+(f?`<section class="feat"><small style="color:#e9cfd4">Destacado</small><h2>${esc(f.title)}</h2><p>${esc(f.excerpt||'')}</p><a class="btn" href="#/post/${f.id}">Entrar al debate</a></section>`:'')
+`<h2>Últimas publicaciones</h2>${grid(l.filter(p=>p.kind=='articulo').slice(0,4))}<h2>Reseñas recientes</h2>${grid(l.filter(p=>p.kind=='resena').slice(0,4))}`},
async articulos(){return `<h1>Artículos</h1>`+grid(live().filter(p=>p.kind=='articulo'))},
async resenas(){const r=live().filter(p=>p.kind=='resena'),g=[...new Set(r.map(p=>p.genre).filter(Boolean))];
return `<h1>Reseñas</h1><div class="bar"><select id="fg"><option value="">Todos los géneros</option>${g.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="fo"><option value="d">Más recientes</option><option value="r">Mejor valoradas</option></select></div><div id="rl">${grid(r)}</div>`},
async post(id){const p=posts.find(x=>x.id==id);if(!p||p.publish_date>today())return '<p>Esta publicación no está disponible.</p>';
const {data:c}=await sb.from('comments').select('name,body,created_at').eq('post_id',id).eq('status','aprobada').order('created_at');
return `<article><small>${esc(p.category||'')} · ${fmt(p.publish_date)}</small><h1>${esc(p.title)}</h1>${p.cover_url?`<img class="ph" src="${esc(p.cover_url)}" alt="">`:''}`
+(p.kind=='resena'?`<p class="st">${esc(p.book_author||'')} · ${esc(p.genre||'')} ${stars(p.rating)}</p>`:'')+paras(p.content)
+`<h2>Comentarios</h2>${(c||[]).map(x=>`<div class="rev"><b>${esc(x.name)}</b><br>${esc(x.body)}</div>`).join('')||'<p class="mut">Sé la primera persona en comentar.</p>'}
<form id="cf"><label>Nombre<input name="name" required maxlength="60"></label><label>Comentario<textarea name="body" rows="4" required minlength="2" maxlength="1500"></textarea></label><input class="hp" name="web" tabindex="-1" autocomplete="off"><button>Enviar comentario</button><p class="mut">Los comentarios se publican cuando se aprueban.</p></form></article>`},
async 'sobre-mi'(){const {data}=await sb.from('site').select('value').eq('key','about').maybeSingle(),v=data?.value||{};
const L=[['instagram','Instagram'],['tiktok','TikTok'],['goodreads','Goodreads']].filter(x=>v[x[0]]).map(x=>`<a href="${esc(v[x[0]])}" rel="noopener">${x[1]}</a>`).join(' · ');
return `<article><h1>Sobre mí</h1>${v.photo_url?`<img class="ph" src="${esc(v.photo_url)}" alt="">`:''}${paras(v.bio)}<h3>Mi trayectoria como lectora</h3>${paras(v.journey)}<h3>Por qué existe este blog</h3>${paras(v.why)}<h3>Qué encontrarás aquí</h3>${paras(v.offers)}<p>${L}</p></article>`},
async calendario(){const m={},t=today();[...posts].sort((a,b)=>a.publish_date<b.publish_date?-1:1).forEach(p=>(m[p.publish_date.slice(0,7)]??=[]).push(p));
return '<h1>Calendario editorial</h1>'+(Object.keys(m).map(k=>`<h3>${new Date(k+'-01T00:00').toLocaleDateString('es',{month:'long',year:'numeric'})}</h3><ul class="cal">${m[k].map(p=>`<li><b>${p.publish_date.slice(8)}</b> ${p.publish_date>t?esc(p.title):`<a href="#/post/${p.id}">${esc(p.title)}</a>`} <small>${p.kind=='resena'?'Reseña':'Artículo'}${p.publish_date>t?' · próximamente':''}</small></li>`).join('')}</ul>`).join('')||'<p class="mut">Sin publicaciones programadas.</p>')},
async comunidad(){const {data}=await sb.from('submissions').select('*').eq('status','aprobada').order('created_at',{ascending:false});
return `<h1>Comunidad lectora</h1><p>Comparte tu reseña de un libro. La revisaré antes de publicarla.</p>
<form id="sf"><label>Título del libro<input name="book_title" required maxlength="150"></label><label>Autor o autora<input name="book_author" maxlength="150"></label><label>Valoración<select name="rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${stars(n)}</option>`).join('')}</select></label><label>Tu opinión<textarea name="opinion" rows="6" required minlength="20" maxlength="3000"></textarea></label><label>Tu nombre<input name="reader_name" required maxlength="60"></label><input class="hp" name="web" tabindex="-1" autocomplete="off"><button>Enviar reseña</button></form>
<h2>Reseñas de lectores</h2>${(data||[]).map(x=>`<div class="rev"><b>${esc(x.book_title)}</b> ${esc(x.book_author||'')} ${stars(x.rating)}<br>${esc(x.opinion)}<br><small>${esc(x.reader_name)}</small></div>`).join('')||'<p class="mut">Aún no hay reseñas de lectores.</p>'}`}};
function bind(id,fn,msg){const f=document.getElementById(id);if(!f)return;f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));if(d.web)return;const {error}=await fn(d);f.outerHTML=`<p class="${error?'err':'ok'}">${error?'No se pudo enviar. Inténtalo de nuevo.':msg}</p>`}}
async function route(){const [r0,a]=(location.hash.slice(2)).split('/'),r=r0 in V?r0:'';app.classList.remove('in');
try{await load();app.innerHTML=await V[r](a)}catch(e){app.innerHTML='<p class="err">No se pudo cargar el contenido. Revisa config.js y que setup.sql esté ejecutado.</p>'}
if(r=='resenas'){const f=()=>{let x=live().filter(p=>p.kind=='resena');if(fg.value)x=x.filter(p=>p.genre==fg.value);if(fo.value=='r')x.sort((p,q)=>q.rating-p.rating);rl.innerHTML=grid(x)};fg.onchange=fo.onchange=f}
if(r=='post')bind('cf',d=>sb.from('comments').insert({post_id:a,name:d.name,body:d.body}),'Gracias. Tu comentario se publicará cuando sea aprobado.');
if(r=='comunidad')bind('sf',d=>sb.from('submissions').insert({book_title:d.book_title,book_author:d.book_author,rating:+d.rating,opinion:d.opinion,reader_name:d.reader_name}),'Gracias. Tu reseña se publicará cuando sea aprobada.');
document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.dataset.r==r));scrollTo(0,0);requestAnimationFrame(()=>app.classList.add('in'))}
addEventListener('hashchange',route);route();
</script></body></html>
